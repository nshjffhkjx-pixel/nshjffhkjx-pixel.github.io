<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار الناس</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#0a0a0a;color:#fff;padding:15px}
.container{max-width:800px;margin:0 auto}
header{background:linear-gradient(90deg,#001a33,#004488);padding:15px;border-radius:12px;border:2px solid #00aaff;margin-bottom:20px;text-align:center}
header h1{color:#66ccff;text-shadow:0 0 15px #00aaff}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;padding:12px;text-align:center;background:#222;border-radius:8px;cursor:pointer;font-weight:700}
.tab.active{background:#00aaff}
.card{background:#111;padding:15px;border-radius:12px;border:1px solid #333;margin-bottom:15px}
input,textarea{width:100%;padding:12px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;border-radius:8px;color:white;font-family:'Cairo',sans-serif}
input[type="file"]{padding:8px}
button{padding:12px 20px;background:linear-gradient(90deg,#0088ff,#00aaff);border:none;border-radius:8px;color:white;font-weight:900;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.progress{height:10px;background:#222;border-radius:5px;margin:15px 0;display:none;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#00aaff,#00ffcc);width:0%;transition:width 0.1s linear}
.news-item{background:#1a1a1a;padding:15px;border-radius:12px;border:1px solid #333;margin-bottom:15px}
.news-item h3{color:#66ccff;margin-bottom:8px}
.meta{color:#888;font-size:13px;margin-bottom:10px}
.news-item img,.news-item video{width:100%;border-radius:8px;margin-bottom:10px;max-height:450px;object-fit:cover}
.comment-box{background:#0a0a0a;padding:10px;border-radius:8px;margin-top:15px;border-left:3px solid #00aaff}
.comment{padding:8px 0;border-bottom:1px solid #222}
.comment-input{display:flex;gap:8px;margin-top:8px}
.empty{text-align:center;color:#666;padding:40px}
.media-preview{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.media-preview img,.media-preview video{width:100px;height:100px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<header><h1>📰 أخبار الناس</h1><p>انشر خبرك بصور وفيديو وعلق عليه فوراً</p></header>
<div class="tabs">
<div class="tab active" onclick="showTab(event, 'feed')">الأخبار</div>
<div class="tab" onclick="showTab(event, 'post')">نشر خبر</div>
</div>
<div id="feedTab"><div id="newsList"><div class="empty">جاري التحميل...</div></div></div>
<div id="postTab" style="display:none">
<div class="card">
<input type="text" id="title" placeholder="عنوان الخبر">
<textarea id="content" rows="6" placeholder="اكتب تفاصيل الخبر هنا"></textarea>
<label style="color:#66ccff">ارفع صور</label>
<input type="file" id="imageFile" accept="image/*" multiple>
<label style="color:#66ccff;margin-top:10px;display:block">ارفع فيديو</label>
<input type="file" id="videoFile" accept="video/*">
<div class="media-preview" id="preview"></div>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<button id="postBtn" onclick="postNews()">نشر الخبر</button>
</div>
</div>
</div>
<script>
const SUPABASE_URL = 'https://sb_publishable_CdeI-_nNCN9esA5Gc1DM1g_imrd2VYX.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CdeI-_nNCN9esA5Gc1DM1g_imrd2VYX';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showTab(e, tab){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById('feedTab').style.display = tab==='feed'?'block':'none';
document.getElementById('postTab').style.display = tab==='post'?'block':'none';
e.currentTarget.classList.add('active');
if(tab==='feed') loadNews();
}

document.getElementById('imageFile').onchange = showPreview;
document.getElementById('videoFile').onchange = showPreview;
function showPreview(){
const preview = document.getElementById('preview');
preview.innerHTML = '';
for(let file of document.getElementById('imageFile').files){
preview.innerHTML += `<img src="${URL.createObjectURL(file)}">`;
}
if(document.getElementById('videoFile').files[0]){
preview.innerHTML += `<video src="${URL.createObjectURL(document.getElementById('videoFile').files[0])}" muted></video>`;
}
}

function updateProgress(p){document.getElementById('progressBar').style.width = p + '%';}

async function postNews(){
const title = document.getElementById('title').value.trim();
const content = document.getElementById('content').value.trim();
const imageFiles = document.getElementById('imageFile').files;
const videoFile = document.getElementById('videoFile').files[0];
if(!title ||!content){alert('اكتب العنوان والمحتوى');return;}
const btn = document.getElementById('postBtn');
btn.disabled = true;btn.textContent = 'جاري النشر...';
let imageUrls = [];let videoUrl = null;
try{
document.getElementById('progress').style.display = 'block';updateProgress(5);
for(let i=0;i<imageFiles.length;i++){
const file = imageFiles[i];
const name = Date.now()+'_img_'+i;
const {error} = await supabase.storage.from('media').upload(name, file);
if(error)throw error;
imageUrls.push(supabase.storage.from('media').getPublicUrl(name).data.publicUrl);
updateProgress(50);
}
if(videoFile){
const name = Date.now()+'_vid';
const {error} = await supabase.storage.from('media').upload(name, videoFile);
if(error)throw error;
videoUrl = supabase.storage.from('media').getPublicUrl(name).data.publicUrl;
}
await supabase.from('news').insert([{title,content,image_urls:imageUrls,video_url:videoUrl}]);
updateProgress(100);
alert('تم النشر!');resetForm();showTab({currentTarget:document.querySelectorAll('.tab')[0]},'feed');
}catch(err){alert('خطأ: '+err.message);}
finally{btn.disabled=false;btn.textContent='نشر الخبر';document.getElementById('progress').style.display='none';}
}

function resetForm(){
document.getElementById('title').value='';document.getElementById('content').value='';
document.getElementById('imageFile').value='';document.getElementById('videoFile').value='';
document.getElementById('preview').innerHTML='';updateProgress(0);
}

async function loadNews(){
const {data,error} = await supabase.from('news').select('*, comments(*)').order('created_at',{ascending:false});
if(error){document.getElementById('newsList').innerHTML='<div class="empty">خطأ في التحميل</div>';return;}
if(!data.length){document.getElementById('newsList').innerHTML='<div class="empty">مفيش أخبار</div>';return;}
document.getElementById('newsList').innerHTML = data.map(n=>`
<div class="news-item">
<h3>${n.title}</h3>
<div class="meta">${new Date(n.created_at).toLocaleString('ar-LY')}</div>
${n.image_urls? n.image_urls.map(u=>`<img src="${u}">`).join(''):''}
${n.video_url? `<video src="${n.video_url}" controls></video>`:''}
<p>${n.content}</p>
<div class="comment-box">
<h4>التعليقات</h4>
<div id="c-${n.id}">${n.comments.map(c=>`<div class="comment">${c.content}</div>`).join('') || '<p>لا توجد تعليقات</p>'}</div>
<div class="comment-input">
<input type="text" id="cm-${n.id}" placeholder="اكتب تعليق">
<button onclick="postComment(${n.id})">تعليق</button>
</div>
</div>
</div>`).join('');
}

async function postComment(id){
const input = document.getElementById('cm-'+id);
const content = input.value.trim();
if(!content)return;
await supabase.from('comments').insert([{news_id:id,content}]);
input.value='';loadNews();
}

document.addEventListener('DOMContentLoaded', loadNews);
</script>
</body>
  </html>
